<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zodiac Academy — Town Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --grass: #3f7d4f;
    --grass-dark: #366a44;
    --path: #cbb994;
    --wood: #8a5a35;
    --wood-dark: #6e4527;
    --roof: #4c7f9e;
    --parchment: #f3ecd8;
    --gold: #e8b94b;
    --crystal: #6fb7e0;
    --ink: #2c2418;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14100c;
    font-family: 'Quicksand', sans-serif;
  }

  .frame {
    position: relative;
    width: 900px;
    height: 600px;
    flex: none;
    transform-origin: top left;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, var(--grass) 0 40px, var(--grass-dark) 40px 80px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  /* top bar */
  .topbar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    font-family: 'Quicksand', sans-serif;
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,16,12,0.55);
    border-radius: 999px;
    padding: 6px 16px 6px 6px;
    backdrop-filter: blur(2px);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--crystal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border: 2px solid var(--parchment);
  }

  .profile-text { color: var(--parchment); line-height: 1.2; }
  .profile-text .name { font-weight: 700; font-size: 14px; }
  .profile-text .sub { font-size: 11px; opacity: 0.8; }

  .currencies { display: flex; gap: 10px; }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(20,16,12,0.55);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--parchment);
    font-weight: 700;
    font-size: 14px;
  }

  .pill .icon { font-size: 16px; }

  /* paths */
  .path {
    position: absolute;
    background: var(--path);
    border-radius: 6px;
  }

  /* buildings */
  .building {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
  }

  .building .roof {
    width: 100%;
    height: 55%;
    background: var(--roof);
    border-radius: 10px 10px 2px 2px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
  }

  .building .base {
    width: 92%;
    height: 45%;
    background: var(--wood);
    border-radius: 0 0 6px 6px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.08);
  }

  .building .tag {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,16,12,0.7);
    color: var(--parchment);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* player */
  .player {
    position: absolute;
    left: 0;
    top: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    z-index: 10;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
  }

  /* dialog */
  .dialog {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translate(-50%, 20px);
    width: min(560px, 92%);
    background: var(--parchment);
    border: 3px solid var(--wood-dark);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--ink);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .dialog.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .dialog h3 {
    margin: 0 0 4px;
    font-family: 'Cinzel', serif;
    font-size: 16px;
  }

  .dialog p { margin: 0; font-size: 13px; line-height: 1.4; }

  .hint {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--parchment);
    border: 2px solid var(--wood-dark);
    border-radius: 8px;
    padding: 4px 12px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
    z-index: 20;
  }
</style>
</head>
<body>

<div class="frame" id="frame">

  <div class="topbar">
    <div class="profile">
      <div class="avatar">♈</div>
      <div class="profile-text">
        <div class="name">Aries</div>
        <div class="sub">Year 1 · Undeclared</div>
      </div>
    </div>
    <div class="currencies">
      <div class="pill"><span class="icon">🪙</span>1,240</div>
      <div class="pill"><span class="icon">💎</span>36</div>
    </div>
  </div>

  <!-- paths -->
  <div class="path" style="left:0; top:290px; width:900px; height:70px;"></div>
  <div class="path" style="left:420px; top:120px; width:70px; height:480px;"></div>

  <!-- buildings -->
  <div class="building" data-name="Academy Hall" data-desc="The central hall where lectures and shared year-one training take place." style="left:150px; top:70px; width:160px; height:120px;">
    <div class="tag">ACADEMY HALL</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Spirit Beast Stables" data-desc="From year two, students contract with their bonded spirit beast here." style="left:620px; top:90px; width:150px; height:110px;">
    <div class="tag">STABLES</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Archives" data-desc="Records of past students, lore of the twelve houses, and old contracts." style="left:70px; top:400px; width:140px; height:110px;">
    <div class="tag">ARCHIVES</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Market Row" data-desc="Stalls selling potion reagents, gear, and the occasional rare relic." style="left:660px; top:410px; width:150px; height:110px;">
    <div class="tag">MARKET</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Training Grounds" data-desc="Where mages and swordsmen spar to prepare for their next trial." style="left:340px; top:420px; width:150px; height:110px;">
    <div class="tag">TRAINING GROUNDS</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <!-- player -->
  <div class="player" id="player" >🧝‍♀️</div>

  <!-- dialog -->
  <div class="dialog" id="dialog" role="status" aria-live="polite">
    <h3 id="dialogTitle"></h3>
    <p id="dialogDesc"></p>
  </div>

  <div class="hint">Move: Arrow keys or W A S D</div>
</div>

<script>
  const frame = document.getElementById('frame');
  const player = document.getElementById('player');
  const dialog = document.getElementById('dialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogDesc = document.getElementById('dialogDesc');

  // --- Constants and state ---
  const MAP_W = 900, MAP_H = 600;
  const PLAYER_SIZE = 40;
  const SPEED = 240;   // px per second
  const RANGE = 40;    // discovery range in px
  const MAX_DT = 0.05; // seconds

  const pos = { x: 420, y: 240 };
  let active = null;

  const buildings = Array.from(document.querySelectorAll('.building')).map(el => ({
    x: parseInt(el.style.left),
    y: parseInt(el.style.top),
    w: parseInt(el.style.width),
    h: parseInt(el.style.height),
    name: el.dataset.name,
    desc: el.dataset.desc
  }));

  // --- Input ---
  const MOVE_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD']);
  const held = new Set();

  window.addEventListener('keydown', e => {
    if (!MOVE_KEYS.has(e.code) || e.ctrlKey || e.altKey || e.metaKey) return;
    e.preventDefault();
    held.add(e.code);
  });
  window.addEventListener('keyup', e => {
    if (MOVE_KEYS.has(e.code)) held.delete(e.code);
  });
  window.addEventListener('blur', () => held.clear());
  document.addEventListener('visibilitychange', () => { if (document.hidden) held.clear(); });

  // --- Simulation ---
  function overlaps(b) {
    return pos.x < b.x + b.w && pos.x + PLAYER_SIZE > b.x &&
           pos.y < b.y + b.h && pos.y + PLAYER_SIZE > b.y;
  }

  function gap(b) {
    const gx = Math.max(b.x - (pos.x + PLAYER_SIZE), pos.x - (b.x + b.w), 0);
    const gy = Math.max(b.y - (pos.y + PLAYER_SIZE), pos.y - (b.y + b.h), 0);
    return Math.hypot(gx, gy);
  }

  function findNearest() {
    let best = null, bestGap = Infinity;
    for (const b of buildings) {
      const g = gap(b);
      if (g > RANGE) continue;
      if (g < bestGap || (g === bestGap && b === active)) { best = b; bestGap = g; }
    }
    return best;
  }

  function step(dt) {
    const has = (a, b) => held.has(a) || held.has(b);
    let dx = (has('ArrowRight', 'KeyD') ? 1 : 0) - (has('ArrowLeft', 'KeyA') ? 1 : 0);
    let dy = (has('ArrowDown', 'KeyS') ? 1 : 0) - (has('ArrowUp', 'KeyW') ? 1 : 0);
    if (dx && dy) { dx /= Math.SQRT2; dy /= Math.SQRT2; }

    pos.x = Math.max(0, Math.min(MAP_W - PLAYER_SIZE, pos.x + dx * SPEED * dt));
    for (const b of buildings) {
      if (!overlaps(b)) continue;
      pos.x = dx > 0 ? b.x - PLAYER_SIZE : b.x + b.w;
    }

    pos.y = Math.max(0, Math.min(MAP_H - PLAYER_SIZE, pos.y + dy * SPEED * dt));
    for (const b of buildings) {
      if (!overlaps(b)) continue;
      pos.y = dy > 0 ? b.y - PLAYER_SIZE : b.y + b.h;
    }

    const near = findNearest();
    if (near !== active) {
      active = near;
      if (active) showDialog(active); else hideDialog();
    }
  }

  // --- Rendering ---
  function showDialog(building) {
    dialogTitle.textContent = building.name;
    dialogDesc.textContent = building.desc;
    dialog.classList.add('show');
  }

  function hideDialog() {
    dialog.classList.remove('show');
  }

  function render() {
    player.style.transform = `translate(${Math.round(pos.x)}px, ${Math.round(pos.y)}px)`;
  }

  function fitFrame() {
    const scale = Math.min(1, innerWidth / MAP_W, innerHeight / MAP_H);
    frame.style.transform = `scale(${scale})`;
    frame.style.margin = `${(scale - 1) * MAP_H / 2}px ${(scale - 1) * MAP_W / 2}px`;
  }
  window.addEventListener('resize', fitFrame);
  fitFrame();

  let last = null;
  function loop(ts) {
    if (last !== null) {
      step(Math.min((ts - last) / 1000, MAX_DT));
      render();
    }
    last = ts;
    requestAnimationFrame(loop);
  }
  render();
  requestAnimationFrame(loop);
</script>

</body>
</html>
