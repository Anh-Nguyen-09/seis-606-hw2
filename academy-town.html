<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zodiac Academy — Town Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --grass: #3f7d4f;
    --grass-dark: #366a44;
    --path: #cbb994;
    --wood: #8a5a35;
    --wood-dark: #6e4527;
    --roof: #4c7f9e;
    --parchment: #f3ecd8;
    --gold: #e8b94b;
    --crystal: #6fb7e0;
    --ink: #2c2418;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #14100c;
    font-family: 'Quicksand', sans-serif;
  }

  .frame {
    position: relative;
    width: 900px;
    max-width: 100vw;
    height: 600px;
    max-height: 100vh;
    overflow: hidden;
    background:
      repeating-linear-gradient(45deg, var(--grass) 0 40px, var(--grass-dark) 40px 80px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  /* top bar */
  .topbar {
    position: absolute;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 20;
    font-family: 'Quicksand', sans-serif;
  }

  .profile {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,16,12,0.55);
    border-radius: 999px;
    padding: 6px 16px 6px 6px;
    backdrop-filter: blur(2px);
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--crystal);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border: 2px solid var(--parchment);
  }

  .profile-text { color: var(--parchment); line-height: 1.2; }
  .profile-text .name { font-weight: 700; font-size: 14px; }
  .profile-text .sub { font-size: 11px; opacity: 0.8; }

  .currencies { display: flex; gap: 10px; }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(20,16,12,0.55);
    border-radius: 999px;
    padding: 6px 14px;
    color: var(--parchment);
    font-weight: 700;
    font-size: 14px;
  }

  .pill .icon { font-size: 16px; }

  /* paths */
  .path {
    position: absolute;
    background: var(--path);
    border-radius: 6px;
  }

  /* buildings */
  .building {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    z-index: 5;
  }

  .building .roof {
    width: 100%;
    height: 55%;
    background: var(--roof);
    border-radius: 10px 10px 2px 2px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,0.15);
  }

  .building .base {
    width: 92%;
    height: 45%;
    background: var(--wood);
    border-radius: 0 0 6px 6px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.08);
  }

  .building .tag {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20,16,12,0.7);
    color: var(--parchment);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }

  /* player */
  .player {
    position: absolute;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    z-index: 10;
    transition: transform 0.1s ease;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
  }

  /* dialog */
  .dialog {
    position: absolute;
    left: 50%;
    bottom: 18px;
    transform: translate(-50%, 20px);
    width: min(560px, 92%);
    background: var(--parchment);
    border: 3px solid var(--wood-dark);
    border-radius: 14px;
    padding: 14px 18px;
    color: var(--ink);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .dialog.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .dialog h3 {
    margin: 0 0 4px;
    font-family: 'Cinzel', serif;
    font-size: 16px;
  }

  .dialog p { margin: 0; font-size: 13px; line-height: 1.4; }

  .hint {
    position: absolute;
    bottom: 10px;
    right: 14px;
    color: rgba(255,255,255,0.65);
    font-size: 11px;
    z-index: 20;
  }
</style>
</head>
<body>

<div class="frame" id="frame">

  <div class="topbar">
    <div class="profile">
      <div class="avatar">♈</div>
      <div class="profile-text">
        <div class="name">Aries</div>
        <div class="sub">Year 1 · Undeclared</div>
      </div>
    </div>
    <div class="currencies">
      <div class="pill"><span class="icon">🪙</span>1,240</div>
      <div class="pill"><span class="icon">💎</span>36</div>
    </div>
  </div>

  <!-- paths -->
  <div class="path" style="left:0; top:290px; width:900px; height:70px;"></div>
  <div class="path" style="left:420px; top:120px; width:70px; height:480px;"></div>

  <!-- buildings -->
  <div class="building" data-name="Academy Hall" data-desc="The central hall where lectures and shared year-one training take place." style="left:150px; top:70px; width:160px; height:120px;">
    <div class="tag">ACADEMY HALL</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Spirit Beast Stables" data-desc="From year two, students contract with their bonded spirit beast here." style="left:620px; top:90px; width:150px; height:110px;">
    <div class="tag">STABLES</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Archives" data-desc="Records of past students, lore of the twelve houses, and old contracts." style="left:70px; top:400px; width:140px; height:110px;">
    <div class="tag">ARCHIVES</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Market Row" data-desc="Stalls selling potion reagents, gear, and the occasional rare relic." style="left:660px; top:410px; width:150px; height:110px;">
    <div class="tag">MARKET</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <div class="building" data-name="Training Grounds" data-desc="Where mages and swordsmen spar to prepare for their next trial." style="left:340px; top:420px; width:150px; height:110px;">
    <div class="tag">TRAINING GROUNDS</div>
    <div class="roof"></div>
    <div class="base"></div>
  </div>

  <!-- player -->
  <div class="player" id="player" style="left:420px; top:240px;">🧝‍♀️</div>

  <!-- dialog -->
  <div class="dialog" id="dialog">
    <h3 id="dialogTitle"></h3>
    <p id="dialogDesc"></p>
  </div>

  <div class="hint">Move with arrow keys or WASD</div>
</div>

<script>
  const frame = document.getElementById('frame');
  const player = document.getElementById('player');
  const dialog = document.getElementById('dialog');
  const dialogTitle = document.getElementById('dialogTitle');
  const dialogDesc = document.getElementById('dialogDesc');

  const FRAME_W = 900, FRAME_H = 600;
  const PLAYER_SIZE = 40;
  const SPEED = 4;

  let pos = { x: 420, y: 240 };
  const keys = {};

  const buildings = Array.from(document.querySelectorAll('.building')).map(el => {
    const rect = {
      el,
      x: parseInt(el.style.left),
      y: parseInt(el.style.top),
      w: parseInt(el.style.width),
      h: parseInt(el.style.height),
      name: el.dataset.name,
      desc: el.dataset.desc
    };
    return rect;
  });

  function overlaps(px, py, rect) {
    return px < rect.x + rect.w &&
           px + PLAYER_SIZE > rect.x &&
           py < rect.y + rect.h &&
           py + PLAYER_SIZE > rect.y;
  }

  function showDialog(building) {
    dialogTitle.textContent = building.name;
    dialogDesc.textContent = building.desc;
    dialog.classList.add('show');
  }

  function hideDialog() {
    dialog.classList.remove('show');
  }

  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function update() {
    let dx = 0, dy = 0;
    if (keys['arrowup'] || keys['w']) dy -= SPEED;
    if (keys['arrowdown'] || keys['s']) dy += SPEED;
    if (keys['arrowleft'] || keys['a']) dx -= SPEED;
    if (keys['arrowright'] || keys['d']) dx += SPEED;

    let nextX = pos.x + dx;
    let nextY = pos.y + dy;

    nextX = Math.max(0, Math.min(FRAME_W - PLAYER_SIZE, nextX));
    nextY = Math.max(0, Math.min(FRAME_H - PLAYER_SIZE, nextY));

    // block movement into buildings (roughly the base, not the whole tile)
    let blocked = false;
    for (const b of buildings) {
      const solid = { x: b.x + 4, y: b.y + b.h * 0.45, w: b.w - 8, h: b.h * 0.55 };
      if (nextX < solid.x + solid.w && nextX + PLAYER_SIZE > solid.x &&
          nextY < solid.y + solid.h && nextY + PLAYER_SIZE > solid.y) {
        blocked = true;
      }
    }

    if (!blocked) {
      pos.x = nextX;
      pos.y = nextY;
    }

    player.style.left = pos.x + 'px';
    player.style.top = pos.y + 'px';

    // check proximity to any building's tag/front area
    let near = null;
    for (const b of buildings) {
      const zone = { x: b.x - 20, y: b.y - 10, w: b.w + 40, h: b.h + 40 };
      if (overlaps(pos.x, pos.y, zone)) { near = b; break; }
    }

    if (near) showDialog(near); else hideDialog();

    requestAnimationFrame(update);
  }

  update();
</script>

</body>
</html>
